<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Kaixo Euskara</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: una columna tipo app móvil (máx. 600px): barra de estado arriba, camino de lecciones como un sendero de monte; las lecciones abren a pantalla completa.
   Paleta propia inspirada en Euskal Herria: verde y rojo de la ikurriña, azul del Cantábrico, ocre de la tierra, blanco de caserío. */
:root{
  --bg:#fbfaf6; --fg:#22302a; --muted:#66746c; --line:#e2dfd4; --soft:#f1efe7;
  --green:#00923f; --green-dk:#006b2e;
  --red:#d52b1e; --red-dk:#a01f15;
  --blue:#1f6f8b; --blue-dk:#164f63;
  --gold:#d9a21b; --gold-dk:#a87b0f;
  --locked:#e4e1d6; --locked-dk:#c8c4b6; --locked-fg:#a29e90;
  --sel-bg:#e2eff3; --sel-line:#6aa5ba; --sel-fg:#1f6f8b;
  --ok-bg:#dcf1e2; --ok-fg:#00792f; --bad-bg:#fbe2de; --bad-fg:#c42418;
  --flame:#e2701c; --heart:#d52b1e;
  --trail:#d8d3c4; --tree:#a9cba5; --tree-dk:#7fae7a;
  --petal:#f4f0e2; --petal-line:#b3aa90;
  --stone:#e8e1cf; --stone-line:#c9bfa6;
  --wall:#ffffff; --roof:#b5523b; --wood:#6e4c33; --hay:#d9b45a; --wool:#ffffff;
  --font:"Nunito","Varela Round","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a16; --fg:#eef2ee; --muted:#8fa096; --line:#2c3a33; --soft:#1a2620;
  --locked:#2c3a33; --locked-dk:#1f2a24; --locked-fg:#5c6d63;
  --sel-bg:#16323b; --sel-line:#3d7d92; --sel-fg:#7cc3da;
  --ok-bg:#16301f; --ok-fg:#5fd08a; --bad-bg:#3a1e1b; --bad-fg:#ff7a6b;
  --blue-dk:#164f63; --trail:#34433b; --tree:#2b4a36; --tree-dk:#3d6a4b; --heart:#ff6a5c; --petal:#e6e1d2; --petal-line:#8f8874; --stone:#a59d8a; --stone-line:#7d7563; --wall:#cfc9ba; --roof:#8e4030; --wood:#4f3624; --hay:#a88a43; --wool:#d9d6cf;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a16; --fg:#eef2ee; --muted:#8fa096; --line:#2c3a33; --soft:#1a2620;
  --locked:#2c3a33; --locked-dk:#1f2a24; --locked-fg:#5c6d63;
  --sel-bg:#16323b; --sel-line:#3d7d92; --sel-fg:#7cc3da;
  --ok-bg:#16301f; --ok-fg:#5fd08a; --bad-bg:#3a1e1b; --bad-fg:#ff7a6b;
  --blue-dk:#164f63; --trail:#34433b; --tree:#2b4a36; --tree-dk:#3d6a4b; --heart:#ff6a5c; --petal:#e6e1d2; --petal-line:#8f8874; --stone:#a59d8a; --stone-line:#7d7563; --wall:#cfc9ba; --roof:#8e4030; --wood:#4f3624; --hay:#a88a43; --wool:#d9d6cf;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;font-weight:700;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.top-in{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wordmark{font-weight:900;font-size:26px;color:var(--green);letter-spacing:-.02em}
.stats{display:flex;gap:14px;align-items:center}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums}
.stat svg{width:22px;height:22px}
.icon-btn{background:none;border:2px solid var(--line);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:20px;height:20px}

/* ---------- home ---------- */
.wrap{max-width:600px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
.hero{display:flex;gap:14px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:16px}
.hero svg.mascot{width:86px;height:86px;flex:none}
.hero-txt{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.hero-txt h1{font-size:20px;font-weight:900}
.hero-txt p{color:var(--muted);font-weight:700;line-height:1.4}
.goal{display:flex;flex-direction:column;gap:5px}
.goal-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .5s ease;position:relative}
.bar>i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:9px;background:rgba(255,255,255,.4)}

.unit{display:flex;flex-direction:column;gap:22px}
.unit-head{background:var(--u);color:#fff;border-radius:10px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 0 var(--ud)}
.unit-head .eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-weight:800}
.unit-head h2{font-size:22px;font-weight:900}
.unit-head p.sub{font-weight:700;opacity:.92;margin-top:2px}
.tips-btn{flex:none;background:transparent;border:2px solid rgba(255,255,255,.45);color:#fff;border-radius:10px;padding:10px 12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:13px;display:flex;gap:6px;align-items:center}
.tips-btn svg{width:18px;height:18px}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:40px;padding-block:14px 6px}
.node-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.node{width:68px;height:64px;border-radius:16px;border:0;display:grid;place-items:center;background:var(--u);box-shadow:inset 0 3px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.12),0 7px 0 var(--ud);color:#fff;transition:transform .08s,box-shadow .08s}
.node svg{width:34px;height:34px}
.node:active{transform:translateY(5px);box-shadow:inset 0 3px 0 rgba(255,255,255,.22),0 2px 0 var(--ud)}
.node.done{background:var(--gold);box-shadow:inset 0 3px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.1),0 7px 0 var(--gold-dk)}
.node.locked{background:var(--locked);box-shadow:0 7px 0 var(--locked-dk);color:var(--locked-fg)}
.node-label{font-size:14px;color:var(--muted);font-weight:800;text-align:center;max-width:150px;background:var(--bg);padding:2px 8px;border-radius:8px}
.node-wrap.current{margin-top:26px}
.node-wrap.current .node{outline:5px solid color-mix(in srgb,var(--u) 25%,transparent);outline-offset:5px}
.start-tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--bg);color:var(--u);border:2px solid var(--line);border-radius:12px;padding:7px 12px;font-weight:900;font-size:14px;letter-spacing:.06em;white-space:nowrap;animation:bob 1.2s ease-in-out infinite}
.start-tip::after{content:"";position:absolute;top:100%;left:50%;width:12px;height:12px;background:var(--bg);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.foot-note{color:var(--muted);font-size:14px;text-align:center;line-height:1.5;display:flex;flex-direction:column;gap:10px;align-items:center}
.link-btn{background:none;border:0;color:var(--blue-dk);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:13px;padding:6px}

/* ---------- botones ---------- */
.btn{border:0;border-radius:10px;background-image:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,0));padding:14px 22px;font-weight:900;font-size:16px;letter-spacing:.06em;text-transform:uppercase;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dk);transition:transform .06s,box-shadow .06s;min-width:150px}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-dk)}
.btn:disabled{background:var(--locked);color:var(--locked-fg);box-shadow:0 4px 0 var(--locked-dk);cursor:default;transform:none}
.btn.red{background:var(--bad-fg);box-shadow:0 4px 0 var(--red-dk)}
.btn.ghost{background:var(--bg);color:var(--muted);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}

/* ---------- lección ---------- */
.lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ls-top{max-width:640px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:16px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ls-top .bar{flex:1;height:16px}
.ls-top .bar>i{background:var(--green)}
.close{background:none;border:0;color:var(--muted);padding:4px;display:grid;place-items:center}
.close svg{width:26px;height:26px}
.hearts{display:flex;align-items:center;gap:4px;color:var(--gold-dk);font-weight:900;font-variant-numeric:tabular-nums}
.hearts svg{width:30px;height:30px}
.ls-body{flex:1;overflow-y:auto;overflow-x:hidden}
.ls-inner{max-width:600px;margin:0 auto;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.ex-label{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--u, var(--green));font-weight:900;display:flex;align-items:center;gap:6px}
.ex-title{font-size:26px;font-weight:900;line-height:1.2}

.foot{border-top:2px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot.ok{background:var(--ok-bg);border-color:transparent}
.foot.bad{background:var(--bad-bg);border-color:transparent}
.foot-in{max-width:640px;margin:0 auto;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fb{display:flex;gap:12px;align-items:center;min-width:0;flex:1 1 260px}
.fb-ic{width:52px;height:52px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none}
.fb-ic svg{width:30px;height:30px}
.foot.ok .fb, .foot.ok .fb-ic{color:var(--ok-fg)}
.foot.bad .fb, .foot.bad .fb-ic{color:var(--bad-fg)}
.fb h3{font-size:22px;font-weight:900}
.fb p{font-size:16px;margin-top:3px;line-height:1.35}
.fb .meaning{opacity:.8;font-weight:700}
.fb .tiny{display:block;font-size:13px;font-weight:700;opacity:.8;letter-spacing:.02em}
.fb .fixed{display:block;font-size:19px;font-weight:800;margin-top:2px}
.fb .fix{text-decoration:underline 3px;text-underline-offset:4px;font-weight:900}
.foot.ok .btn{background:var(--green);box-shadow:0 4px 0 var(--green-dk)}
.foot.bad .btn{background:var(--bad-fg);box-shadow:0 4px 0 var(--red-dk)}
.foot-btns{display:flex;gap:10px;margin-left:auto}

/* tarjeta nueva */
.intro-card{border:2px solid var(--line);border-radius:14px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.intro-card .em{font-size:64px;line-height:1}
.intro-card .eu{font-size:34px;font-weight:900;color:var(--fg);display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.intro-card .es{font-size:20px;color:var(--muted)}
.tip{background:var(--soft);border-radius:10px;padding:12px 14px;font-weight:700;line-height:1.45;color:var(--fg);text-align:left;width:100%}
.tip b{color:var(--u, var(--green))}
.spk{border:0;background:var(--blue);color:#fff;width:46px;height:46px;border-radius:10px;display:inline-grid;place-items:center;box-shadow:0 4px 0 var(--blue-dk);flex:none}
.spk:active{transform:translateY(4px);box-shadow:none}
.spk svg{width:24px;height:24px}
.spk.big{width:96px;height:84px;border-radius:14px}
.spk.big svg{width:44px;height:44px}
.spk.slow{width:64px;height:58px;border-radius:10px;font-size:13px;font-weight:900}

/* opciones */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.card{border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;background:var(--bg);padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:18px;font-weight:800}
.card .em{font-size:52px;line-height:1}
.opt-list{display:flex;flex-direction:column;gap:12px}
.opt{border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;background:var(--bg);padding:14px 16px;display:flex;align-items:center;gap:14px;font-size:18px;font-weight:700;text-align:left}
.opt .k{width:30px;height:30px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:14px;color:var(--muted);flex:none}
.sel{border-color:var(--sel-line)!important;background:var(--sel-bg)!important;color:var(--sel-fg)!important}
.sel .k{border-color:var(--sel-line);color:var(--sel-fg)}
.card:active,.opt:active,.tile:active,.mt:active{transform:translateY(2px)}

/* frase fuente */
.source{display:flex;align-items:flex-end;gap:10px}
.source svg.mascot{width:78px;height:78px;flex:none}
.bubble{border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:19px;position:relative;display:flex;gap:10px;align-items:center;min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;bottom:18px;width:12px;height:12px;background:var(--bg);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .spk{width:38px;height:38px;border-radius:11px}
.bubble .spk svg{width:20px;height:20px}

.hw{position:relative;border-bottom:2px dashed var(--muted);cursor:help;outline:none}
.hw:focus-visible{border-bottom-color:var(--blue)}
.hwt{display:none;position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:14px;line-height:1.3;font-weight:800;padding:6px 10px;border-radius:10px;white-space:nowrap;z-index:5;pointer-events:none}
.hwt::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--fg)}
.hw:hover .hwt,.hw.on .hwt{display:block}
.hint-note{font-size:13px;color:var(--muted);margin-top:-12px}
.prog-txt{font-size:14px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
/* canción */
.songs{display:flex;flex-direction:column;gap:10px}
.songs-title{display:flex;align-items:center;gap:6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-dk);font-weight:900}
.songs-title svg{width:16px;height:16px}

.song-card{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-radius:14px;padding:14px 16px;flex-wrap:wrap}
.song-ic{width:52px;height:52px;border-radius:12px;background:var(--gold);color:#fff;display:grid;place-items:center;flex:none;box-shadow:inset 0 3px 0 rgba(255,255,255,.22),0 4px 0 var(--gold-dk)}
.song-ic svg{width:28px;height:28px}
.song-txt{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:2px}
.song-txt .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-dk);font-weight:900}
.song-txt h2{font-size:19px;font-weight:900}
.song-txt p:last-child{color:var(--muted);font-size:14px;line-height:1.4}
.btn.small{min-width:0;padding:11px 16px;font-size:14px}
.btn svg{width:18px;height:18px;vertical-align:-3px}
.song-head{flex:1;min-width:0}
.song-head h2{font-size:20px;font-weight:900}
.song-head p{font-size:13px;color:var(--muted)}
.song-lyrics{gap:8px}
.sec-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold-dk);font-weight:900;margin-top:10px}
.sl{display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:2px solid transparent;border-radius:10px;padding:8px 12px;width:100%}
.sl .eu{font-size:21px;font-weight:800;color:var(--fg)}
.sl .es{font-size:14px;color:var(--muted);font-weight:700}
.no-es .sl .es{display:none}
.sl.past .eu{color:var(--muted)}
.sl.cur{background:var(--soft);border-color:var(--line)}
.sl.cur .sy.sung{color:var(--green)}
.sl:hover{border-color:var(--line)}
.song-ctrl{justify-content:flex-end}
.chip-btn{border:2px solid var(--line);background:var(--bg);color:var(--muted);border-radius:10px;padding:10px 12px;font-weight:800;font-size:14px}
.chip-btn.on{border-color:var(--sel-line);background:var(--sel-bg);color:var(--sel-fg)}
.clock-wrap{display:flex;justify-content:center}
.clock{width:170px;height:170px;max-width:60vw}
@media (max-height:620px){.clock{width:130px;height:130px}}
/* constructor */
.answer{min-height:122px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:4px 0;background:repeating-linear-gradient(to bottom,transparent 0 56px,var(--line) 56px 58px,transparent 58px 61px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--bg);padding:9px 14px;font-size:18px;font-weight:700}
.tile.used{background:var(--line);color:transparent;border-color:var(--line);pointer-events:none}

/* parejas */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:12px;min-width:0}
.mt{border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;background:var(--bg);padding:14px 8px;font-size:17px;font-weight:700;min-height:58px}
.mt.done{opacity:.35;pointer-events:none;border-color:var(--line);background:var(--bg);color:var(--muted)}
.mt.wrong{border-color:var(--bad-fg);background:var(--bad-bg);color:var(--bad-fg);animation:shake .3s}
.mt.right{border-color:var(--ok-fg);background:var(--ok-bg);color:var(--ok-fg)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* completar */
.fill-line{font-size:24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.blank{min-width:90px;border-bottom:3px solid var(--line);text-align:center;padding:2px 8px;color:var(--sel-fg)}
.meaning-line{color:var(--muted);font-size:17px}

/* escribir */
.type-in{width:100%;border:2px solid var(--line);border-radius:10px;background:var(--soft);color:var(--fg);font:inherit;font-size:20px;padding:16px;min-height:110px;resize:none}

/* diálogo */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:88%}
.msg.ane{align-self:flex-end;flex-direction:row-reverse}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;flex:none}
.msg.mikel .ava{background:var(--blue)}
.msg.ane .ava{background:var(--red)}
.mb{border:2px solid var(--line);border-radius:10px;padding:10px 13px;min-width:0}
.mb .t{font-size:18px}
.mb .s{font-size:14px;color:var(--muted);margin-top:3px}
.msg.ane .mb{background:var(--soft)}
.msg.q .mb{border-color:var(--blue)}

/* resultados */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.result svg.mascot{width:140px;height:140px}
.result h2{font-size:30px;font-weight:900;color:var(--gold-dk)}
.result.fail h2{color:var(--bad-fg)}
.result .lead{color:var(--muted);font-size:18px}
.chips{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.chip{border:2px solid var(--c);border-radius:10px;overflow:hidden;min-width:104px}
.chip .h{background:var(--c);color:#fff;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;font-weight:900}
.chip .v{padding:12px 8px;font-size:22px;font-weight:900;color:var(--c);font-variant-numeric:tabular-nums}

/* modal consejos */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:24px;font-weight:900;color:var(--u)}
.sheet h3{font-size:18px;font-weight:900;margin-top:4px}
.sheet p,.sheet li{line-height:1.55;font-weight:600;max-width:65ch}
.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet table{border-collapse:collapse;width:100%;font-weight:700}
.sheet td{border-bottom:2px solid var(--line);padding:8px 6px}
.sheet td:first-child{color:var(--u);font-weight:900;width:38%}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:800;z-index:70;max-width:calc(100% - 32px);text-align:center}

{ id:'u2', n:2, title:'Presentarse', sub:'Quién eres, cómo te llamas, de dónde eres', color:'#d52b1e', dark:'#a01f15',
  tips:`<h3>El verbo va al final</h3>
  <p>En euskera el verbo suele ir al final de la frase. <i>Ni Ane naiz</i> es, palabra por palabra, «Yo Ane soy».</p>
  <h3>El verbo «ser» (izan)</h3>
  <table><tbody>
  <tr><td>ni naiz</td><td>yo soy</td></tr>
  <tr><td>zu zara</td><td>tú eres / usted es</td></tr>
  <tr><td>hura da</td><td>él / ella es</td></tr>
  </tbody></table>
  <p>Como en español, el «yo» se puede omitir: <i>Ane naiz</i> = «Soy Ane».</p>
  <h3>«Zu» vale para tú y para usted</h3>
  <p>No hace falta elegir entre tú y usted: <i>zu</i> sirve para ambos. Existe otra forma, <i>hi</i>, muy coloquial, que de momento no necesitas.</p>
  <h3>De dónde eres: -koa / -goa</h3>
  <p>Para decir de dónde eres, añade <b>-koa</b> al lugar: <i>Bilbo → Bilbokoa</i>, <i>Gasteiz → Gasteizkoa</i>. Si el nombre acaba en <b>n</b> o <b>l</b>, se convierte en <b>-goa</b>: <i>Madril → Madrilgoa</i>.</p>
  <h3>La -a del final</h3>
  <p>El artículo «el / la» va pegado al final de la palabra: <i>izen</i> (nombre) → <i>izena</i> (el nombre); <i>ikasle</i> (estudiante) → <i>ikaslea</i>.</p>`,
  lessons:[
  { id:'l4', title:'Yo soy…', ex:[
    I('Ni','Yo'),
    I('Naiz','Soy','En euskera el verbo suele ir <b>al final</b>.'),
    I('Ni Ane naiz','Yo soy Ane','Palabra por palabra: «Yo Ane soy».'),
    B('es2eu','Yo soy Mikel',['Ni Mikel naiz','Mikel naiz'],['zara','zu','da']),
    I('Zara','Eres','<b>zu zara</b> = tú eres'),
    F('Tú eres Ane','Zu Ane','',['zara','naiz','da'],'zara'),
    F('Yo soy Mikel','Ni Mikel','',['naiz','zara','eta'],'naiz'),
    I('Nor zara zu?','¿Quién eres tú?','<b>nor</b> = quién'),
    C('¿Qué significa «Nor zara zu?»','Nor zara zu?',['¿Quién eres tú?','¿Qué tal?','¿Y tú?'],'¿Quién eres tú?'),
    B('eu2es','Ni Ane naiz, eta zu?',['Yo soy Ane, ¿y tú?','Soy Ane, ¿y tú?'],['eres','quién','bien']),
    M([['Ni','Yo'],['Zu','Tú'],['Naiz','Soy'],['Zara','Eres'],['Nor','Quién']]),
    L('Nor zara zu?',['ni','naiz'],'¿Quién eres tú?'),
    T('Yo soy Ane',['ni ane naiz','ane naiz']),
  ]},
  { id:'l5', title:'Mi nombre es…', ex:[
    I('Izena','El nombre','<b>izen</b> = nombre. La <b>-a</b> final hace de artículo: izena = «el nombre».'),
    I('Nire izena Ane da','Mi nombre es Ane','<b>nire</b> = mi · <b>da</b> = es. El verbo, otra vez, al final.'),
    I('Zure','Tu','Viene de <b>zu</b> (tú).'),
    I('Zein da zure izena?','¿Cuál es tu nombre?','<b>zein</b> = cuál'),
    C('¿Qué significa «Zein da zure izena?»','Zein da zure izena?',['¿Cuál es tu nombre?','¿Quién eres tú?','¿Qué tal?'],'¿Cuál es tu nombre?'),
    F('Mi nombre es Mikel','Nire izena Mikel','',['da','naiz','zara'],'da'),
    B('es2eu','Mi nombre es Ane',['Nire izena Ane da'],['zure','naiz','zein']),
    I('Pozten naiz zu ezagutzeaz','Encantado/a de conocerte','Literalmente «me alegro de conocerte». No cambia si eres hombre o mujer.'),
    C('¿Cómo se dice «Encantada de conocerte»?',null,['Pozten naiz zu ezagutzeaz','Zein da zure izena?','Eskerrik asko'],'Pozten naiz zu ezagutzeaz'),
    M([['Nire','Mi'],['Zure','Tu'],['Izena','El nombre'],['Zein','Cuál'],['Da','Es']]),
    B('eu2es','Kaixo! Zein da zure izena?',['Hola, ¿cuál es tu nombre?'],['mi','soy','quién']),
    L('Nire izena Mikel da',['zure','naiz'],'Mi nombre es Mikel'),
    T('¿Cuál es tu nombre?',['zein da zure izena']),
  ]},
  { id:'l6', title:'¿De dónde eres?', ex:[
    I('Nongoa zara?','¿De dónde eres?'),
    I('Bilbokoa naiz','Soy de Bilbao','<b>Bilbo</b> (Bilbao) + <b>-koa</b> = de Bilbao'),
    I('Madrilgoa naiz','Soy de Madrid','Tras <b>n</b> o <b>l</b>, -koa pasa a <b>-goa</b>: Madril → Madrilgoa.'),
    C('¿Cómo se dice «Soy de Vitoria»? (Vitoria = Gasteiz)',null,['Gasteizkoa naiz','Gasteiz naiz','Gasteizkoa zara'],'Gasteizkoa naiz'),
    C('¿Cómo se dice «Soy de Barcelona»? (Barcelona = Bartzelona)',null,['Bartzelonakoa naiz','Bartzelonagoa naiz','Bartzelonakoa da'],'Bartzelonakoa naiz'),
    I('Ikaslea naiz','Soy estudiante','<b>ikasle</b> = estudiante'),
    I('Euskara ikasten ari naiz','Estoy aprendiendo euskera','<b>ikasi</b> = aprender · <b>ari naiz</b> = estoy (haciendo algo). Fíjate: <b>ikas</b>le e <b>ikas</b>ten comparten raíz.'),
    B('es2eu','Soy estudiante, ¿y tú?',['Ikaslea naiz, eta zu?','Ni ikaslea naiz, eta zu?'],['zara','nire','bai']),
    B('eu2es','Euskara ikasten ari naiz',['Estoy aprendiendo euskera'],['soy','de','eres']),
    M([['Nongoa','De dónde'],['Ikaslea','Estudiante'],['Euskara','Euskera'],['Bilbo','Bilbao'],['Gasteiz','Vitoria']]),
    D([{who:'Mikel',eu:'Kaixo! Nongoa zara?',es:'¡Hola! ¿De dónde eres?'}],['Madrilgoa naiz.','Madrilgoa zara.','Bihar arte.'],'Madrilgoa naiz.','Soy de Madrid.'),
    L('Nongoa zara?',['naiz','zu'],'¿De dónde eres?'),
    T('Soy de Bilbao',['bilbokoa naiz','ni bilbokoa naiz']),
  ]},
]},

{ id:'u4', n:4, title:'Números', sub:'Contar, pedir en el bar y decir tu edad', color:'#7a4fa3', dark:'#5a3a7a',
  tips:`<h3>Del 1 al 10</h3>
  <table><tbody>
  <tr><td>bat</td><td>1</td></tr><tr><td>bi</td><td>2</td></tr><tr><td>hiru</td><td>3</td></tr><tr><td>lau</td><td>4</td></tr><tr><td>bost</td><td>5</td></tr>
  <tr><td>sei</td><td>6</td></tr><tr><td>zazpi</td><td>7 (suena «saspi»)</td></tr><tr><td>zortzi</td><td>8 (suena «sortsi»)</td></tr><tr><td>bederatzi</td><td>9</td></tr><tr><td>hamar</td><td>10 (la h no suena)</td></tr>
  </tbody></table>
  <h3>Del 11 al 20</h3>
  <table><tbody>
  <tr><td>hamaika</td><td>11</td></tr><tr><td>hamabi … hamazazpi</td><td>12 … 17 (hama + número)</td></tr><tr><td>hemezortzi</td><td>18 (ojo: heme-)</td></tr><tr><td>hemeretzi</td><td>19 (ojo: heme-)</td></tr><tr><td>hogei</td><td>20</td></tr>
  </tbody></table>
  <h3>Se cuenta de veinte en veinte</h3>
  <p><b>hogeita</b> = «veinte y»: <i>hogeita bat</i> (21), <i>hogeita bi</i> (22)… y <i>hogeita hamar</i> (30) es «veinte y diez».</p>
  <h3>«Bat» va detrás, los demás delante</h3>
  <p><b>Bat</b> (uno) funciona como «un/una» y va <b>detrás</b> del nombre: <i>kafe bat</i> = un café. El resto de números van <b>delante</b>: <i>bi kafe</i> = dos cafés.</p>
  <h3>Sin plural detrás del número</h3>
  <p>Con un número, el nombre no va en plural: <i>hiru kafe</i> (tres cafés), <i>bost euro</i> (cinco euros), <i>hogei urte</i> (veinte años).</p>
  <h3>Frases útiles</h3>
  <table><tbody>
  <tr><td>Zenbat da?</td><td>¿Cuánto es?</td></tr><tr><td>Zer nahi duzu?</td><td>¿Qué quieres?</td></tr><tr><td>Beste ezer?</td><td>¿Algo más?</td></tr>
  <tr><td>Zenbat urte dituzu?</td><td>¿Cuántos años tienes?</td></tr><tr><td>Hogei urte ditut</td><td>Tengo veinte años</td></tr>
  </tbody></table>`,
  lessons:[
  { id:'l8', title:'Del 1 al 5', ex:[

    I('Bi','Dos'),
    P('Uno','Bat',['Bi']),
    I('Hiru','Tres'),
    C('¿Qué número es «Hiru»?','Hiru',['3','2','1'],'3'),

    M([['Bat','1'],['Bi','2'],['Hiru','3'],['Lau','4'],['Bost','5']]),

    C('¿Cómo se dice «Un café, por favor»?','',['Kafe bat, mesedez','Bat kafe, mesedez','Kafe bi, mesedez'],'Kafe bat, mesedez'),

  { id:'l10', title:'Del 6 al 10', ex:[

    I('Zazpi','Siete','La <b>z</b> suena como la «s» española: «saspi».'),

    I('Bederatzi','Nueve'),
    I('Hamar','Diez','La <b>h</b> no suena: «amar».'),

    M([['Sei','6'],['Zazpi','7'],['Zortzi','8'],['Bederatzi','9'],['Hamar','10']]),

    M([['Bi','2'],['Lau','4'],['Bost','5'],['Sei','6'],['Hamar','10']]),
    L('Sei, zazpi, zortzi',['bost','hamar'],'Seis, siete, ocho'),
    B('eu2es','Bat, bi, hiru, lau, bost',['Uno, dos, tres, cuatro, cinco'],['seis','diez']),

  ]},
  { id:'l11', title:'En el bar', ex:[
    I('Bi kafe, mesedez','Dos cafés, por favor','<b>bat</b> va detrás, pero los demás números van <b>delante</b>. Y el nombre no va en plural: «bi kafe».'),

    I('Garagardo bat','Una cerveza','<b>garagardo</b> = cerveza'),

    C('¿Qué significa «Hiru garagardo»?','Hiru garagardo',['Tres cervezas','Una cerveza','Tres cafés'],'Tres cervezas'),
    I('Zenbat da?','¿Cuánto es?','Para preguntar el precio. <b>zenbat</b> = cuánto · <b>da</b> = es.'),

    D([{who:'Mikel',eu:'Kaixo! Zer nahi duzu?',es:'¡Hola! ¿Qué quieres?'}],['Kafe bat, mesedez.','Bat kafe, mesedez.','Zenbat zara?'],'Kafe bat, mesedez.','Un café, por favor.'),
    D([{who:'Mikel',eu:'Kaixo! Zer nahi duzu?',es:'¡Hola! ¿Qué quieres?'},{who:'Ane',eu:'Kafe bat, mesedez.',es:'Un café, por favor.'},{who:'Mikel',eu:'Beste ezer?',es:'¿Algo más?'}],['Ez, eskerrik asko. Zenbat da?','Bai, zenbat zara?','Bost kafe naiz.'],'Ez, eskerrik asko. Zenbat da?','No, gracias. ¿Cuánto es?'),
    L('Bi garagardo, mesedez',['kafe','bat'],'Dos cervezas, por favor'),

  { id:'l12', title:'Del 11 al 20', ex:[
    I('Hamaika','Once','Es especial. Curiosidad: también se usa para decir «muchísimos».'),

    C('¿Qué número es «Hamabost»?','Hamabost',['15','14','5'],'15'),

    I('Hamazazpi','Diecisiete'),

    I('Hogei','Veinte'),
    M([['Hamaika','11'],['Hamabi','12'],['Hamalau','14'],['Hemezortzi','18'],['Hogei','20']]),
    C('¿Cómo se dice «trece»?','',['Hamahiru','Hamaika','Hemeretzi'],'Hamahiru'),
    L('Hamasei, hamazazpi',['hogei','hamabi'],'Dieciséis, diecisiete'),
    T('Veinte',['hogei']),
  ]},
  { id:'l13', title:'¿Cuántos años tienes?', final:true, ex:[
    I('Urte','Año','Como con los euros, no hay plural tras el número: «hogei urte».'),
    I('Zenbat urte dituzu?','¿Cuántos años tienes?','<b>dituzu</b> = tienes (cuando lo que tienes es plural, como los años).'),
    I('Hogei urte ditut','Tengo veinte años','<b>ditut</b> = tengo.'),
    C('¿Qué significa «Hamazazpi urte ditut»?','Hamazazpi urte ditut',['Tengo diecisiete años','Tengo siete años','Tengo diecisiete euros'],'Tengo diecisiete años'),
    F('Tengo quince años','Hamabost urte','',['ditut','dituzu','naiz'],'ditut'),
    I('Hogeita bat','Veintiuno','<b>hogeita</b> = «veinte y»: hogeita bat, hogeita bi…'),
    I('Hogeita hamar','Treinta','¡Se cuenta de veinte en veinte! Treinta es «veinte y diez».'),

    L('Hogeita hamar urte ditut',['hogei','dituzu'],'Tengo treinta años'),
    T('¿Cuántos años tienes?',['zenbat urte dituzu']),
  ]},

{ id:'u5', n:5, title:'Los días', sub:'La semana, hoy, ayer, mañana y quedar', color:'#d9841c', dark:'#a5620f',
  tips:`<h3>Los días de la semana</h3>
  <table><tbody>
  <tr><td>astelehena</td><td>lunes</td></tr><tr><td>asteartea</td><td>martes</td></tr><tr><td>asteazkena</td><td>miércoles</td></tr>
  <tr><td>osteguna</td><td>jueves</td></tr><tr><td>ostirala</td><td>viernes</td></tr><tr><td>larunbata</td><td>sábado</td></tr><tr><td>igandea</td><td>domingo</td></tr>
  </tbody></table>
  <h3>Los tres primeros tienen truco</h3>
  <p>Todos empiezan por <b>aste</b> (semana):</p>
  <ul><li><b>aste + lehen</b> (primero) → astelehena, el lunes</li><li><b>aste + arte</b> (entre) → asteartea, el martes</li><li><b>aste + azken</b> (último) → asteazkena, el miércoles</li></ul>
  <p>Se suele explicar que antiguamente la semana vasca tenía solo tres días, y por eso hay un «primero», un «de en medio» y un «último».</p>
  <h3>Hoy, ayer y mañana</h3>
  <table><tbody><tr><td>atzo</td><td>ayer</td></tr><tr><td>gaur</td><td>hoy</td></tr><tr><td>bihar</td><td>mañana</td></tr></tbody></table>
  <p><i>Gaur ostirala da</i> = hoy es viernes. Para el pasado se usa <b>zen</b> (era): <i>Atzo osteguna zen</i> = ayer era jueves.</p>
  <h3>Decir cuándo: -ean / -n</h3>
  <p>Para decir que algo pasa un día, se quita la <b>-a</b> del final y se añade <b>-ean</b> (o <b>-an</b>):</p>
  <table><tbody>
  <tr><td>astelehenean</td><td>el lunes</td></tr><tr><td>ostiralean</td><td>el viernes</td></tr><tr><td>larunbatean</td><td>el sábado</td></tr><tr><td>igandean</td><td>el domingo</td></tr><tr><td>asteburuan</td><td>el fin de semana</td></tr>
  </tbody></table>
  <h3>Para quedar</h3>
  <table><tbody><tr><td>Ados!</td><td>¡De acuerdo!</td></tr><tr><td>Igande arte!</td><td>¡Hasta el domingo!</td></tr><tr><td>Zer egiten duzu…?</td><td>¿Qué haces…?</td></tr></tbody></table>`,
  lessons:[
  { id:'l9', title:'Lunes, martes y miércoles', ex:[
    I('Aste','Semana','Los tres primeros días empiezan por <b>aste</b>.'),
    I('Astelehena','Lunes','<b>lehen</b> = primero: el «primero de la semana».'),
    I('Asteartea','Martes','<b>arte</b> = entre: el día «de en medio».'),

{ id:'u6', n:6, title:'El tiempo', sub:'Estaciones, lluvia, sol, calor y frío', color:'#178a76', dark:'#0f6455',
  tips:`<h3>Las cuatro estaciones (urtaroak)</h3>
  <table><tbody>
  <tr><td>udaberria</td><td>primavera</td></tr><tr><td>uda</td><td>verano</td></tr><tr><td>udazkena</td><td>otoño</td></tr><tr><td>negua</td><td>invierno</td></tr>
  </tbody></table>
  <p>Truco: todo gira alrededor de <b>uda</b> (verano). <i>Uda + berri</i> (nuevo) = primavera, «el verano nuevo». <i>Uda + azken</i> (último) = otoño, «el final del verano». ¡El mismo <b>azken</b> que en <i>asteazkena</i>!</p>
  <h3>¿Qué tiempo hace?</h3>
  <table><tbody>
  <tr><td>Eguzkia dago</td><td>Hace sol</td></tr><tr><td>Euria ari du</td><td>Está lloviendo</td></tr><tr><td>Elurra ari du</td><td>Está nevando</td></tr>
  <tr><td>Bero egiten du</td><td>Hace calor</td></tr><tr><td>Hotz egiten du</td><td>Hace frío</td></tr><tr><td>Haizea dabil</td><td>Hace viento</td></tr>
  <tr><td>Hodeitsu dago</td><td>Está nublado</td></tr><tr><td>Lainoa dago</td><td>Hay niebla</td></tr><tr><td>Txirimiri</td><td>Llovizna («sirimiri»)</td></tr>
  </tbody></table>
  <h3>Ahora o siempre</h3>
  <p><i>Euria <b>ari du</b></i> = está lloviendo (ahora). <i>Euria <b>egiten du</b></i> = llueve (habitualmente): <i>Udazkenean euri asko egiten du</i>, en otoño llueve mucho.</p>
  <h3>En cada estación: -an / -n</h3>
  <p>Igual que con los días: <i>udan</i> (en verano), <i>neguan</i> (en invierno), <i>udaberrian</i> (en primavera), <i>udazkenean</i> (en otoño).</p>
  <h3>El futuro</h3>
  <p><i>egiten du</i> (hace) → <i><b>egingo</b> du</i> (hará): <i>Bihar euria egingo du</i> = mañana lloverá.</p>`,
  lessons:[
  { id:'l18', title:'Las estaciones', ex:[
    I('Urtaroa','La estación (del año)','Hay cuatro <b>urtaro</b>.'),
    I('Uda','Verano'),
    I('Negua','Invierno'),
    P('Invierno','Negua',['Uda']),
    I('Udaberria','Primavera','<b>uda</b> + <b>berri</b> (nuevo): el «verano nuevo».'),
    I('Udazkena','Otoño','<b>uda</b> + <b>azken</b> (último): el «final del verano». ¡Como en ast<b>eazken</b>a!'),
    P('Otoño','Udazkena',['Udaberria','Negua']),
    M([['Udaberria','Primavera'],['Uda','Verano'],['Udazkena','Otoño'],['Negua','Invierno'],['Urtaroa','Estación']]),
    I('Lau urtaro','Cuatro estaciones','Recuerda: después del número, sin plural.'),
    B('es2eu','La primavera y el verano',['Udaberria eta uda'],['negua','udazkena','da']),
    B('eu2es','Negua eta udazkena',['El invierno y el otoño'],['verano','primavera','es']),
    L('Udaberria, uda, udazkena, negua',['lau','urtaroa'],'Primavera, verano, otoño, invierno'),
    T('Invierno',['negua']),
  ]},
  { id:'l19', title:'Sol, lluvia y nieve', ex:[
    I('Eguraldia','El tiempo (meteorológico)'),
    I('Zer eguraldi egiten du?','¿Qué tiempo hace?','<b>zer</b> = qué · <b>egiten du</b> = hace.'),
    I('Eguzkia dago','Hace sol','<b>eguzkia</b> = el sol · <b>dago</b> = está / hay.'),
    I('Euria ari du','Está lloviendo','<b>euria</b> = la lluvia.'),

    I('Elurra ari du','Está nevando','<b>elurra</b> = la nieve.'),
    P('Está nevando','Elurra ari du',['Euria ari du','Eguzkia dago']),
    I('Txirimiri','Llovizna','La lluvia fina tan típica del País Vasco. En español también se dice «sirimiri».'),
    I('Aterkia','El paraguas'),
    M([['Eguzkia','El sol'],['Euria','La lluvia'],['Elurra','La nieve'],['Aterkia','El paraguas'],['Eguraldia','El tiempo']]),
    B('es2eu','Hoy está lloviendo',['Gaur euria ari du'],['eguzkia','dago','bihar']),
    D([{who:'Mikel',eu:'Zer eguraldi egiten du?',es:'¿Qué tiempo hace?'}],['Eguzkia dago.','Eguzkia naiz.','Euria zara.'],'Eguzkia dago.','Hace sol.'),
    L('Elurra ari du',['euria','dago'],'Está nevando'),

  ]},
  { id:'l20', title:'Calor, frío y nubes', ex:[

    I('Hotz egiten du','Hace frío','<b>hotz</b> = frío (la h no suena).'),

    I('Ze bero!','¡Qué calor!','<b>ze</b> = qué, en exclamaciones.'),
    I('Ze hotz!','¡Qué frío!'),
    I('Haizea dabil','Hace viento','<b>haizea</b> = el viento · <b>dabil</b> = anda: «el viento anda».'),
    I('Hodeitsu dago','Está nublado','<b>hodei</b> = nube · <b>-tsu</b> = lleno de: «lleno de nubes».'),
    I('Lainoa dago','Hay niebla'),
    P('Está nublado','Hodeitsu dago',['Haizea dabil','Lainoa dago']),
    M([['Bero','Calor'],['Hotz','Frío'],['Haizea','El viento'],['Hodei','Nube'],['Lainoa','La niebla']]),
    B('es2eu','Hoy hace frío',['Gaur hotz egiten du'],['bero','dago','zen']),
    F('Hace calor','Bero','du',['egiten','dago','ari'],'egiten'),
    L('Ze bero! Eguzkia dago',['hotz','haizea'],'¡Qué calor! Hace sol'),
    T('Hace frío',['hotz egiten du','hotza egiten du']),
  ]},
  { id:'l21', title:'En invierno hace frío', ex:[
    I('Neguan','En invierno','Para decir <b>cuándo</b>: negua → negu<b>an</b>, como con los días (astelehen<b>ean</b>).'),
    I('Neguan hotz egiten du','En invierno hace frío'),
    I('Udan','En verano','uda → uda<b>n</b>'),
    I('Udan bero egiten du','En verano hace calor'),
    C('¿Qué significa «Udan»?','Udan',['En verano','Verano','Hasta el verano'],'En verano'),
    I('Udazkenean euri asko egiten du','En otoño llueve mucho','<b>euri asko</b> = mucha lluvia. Para lo habitual se dice <b>euria egiten du</b>; <b>euria ari du</b> es «está lloviendo» ahora.'),
    I('Eguraldi ona','Buen tiempo','<b>on</b> = bueno, como en egun <b>on</b>.'),
    I('Udaberrian eguraldi ona egiten du','En primavera hace buen tiempo','udaberria → udaberri<b>an</b>'),
    I('Eguraldi txarra','Mal tiempo','<b>txar</b> = malo.'),
    C('¿Cómo se dice «en otoño»?','',['Udazkenean','Udazkena','Udazken arte'],'Udazkenean'),
    B('es2eu','En invierno hace frío',['Neguan hotz egiten du'],['negua','bero','dago']),
    B('eu2es','Udan bero egiten du',['En verano hace calor'],['invierno','frío','está']),
    L('Udaberrian eguraldi ona egiten du',['txarra','neguan'],'En primavera hace buen tiempo'),
    T('En verano',['udan']),
  ]},
  { id:'l22', title:'¿Qué tiempo hará?', final:true, ex:[
    I('Bihar euria egingo du','Mañana lloverá','<b>egingo du</b> = hará. Es el futuro de <b>egiten du</b>.'),
    I('Aterkia daukazu?','¿Tienes paraguas?','<b>daukazu</b> = tienes · <b>daukat</b> = tengo.'),
    I('Nire urtaro gogokoena uda da','Mi estación favorita es el verano','<b>gogokoena</b> = favorito/a.'),
    convo(0,CONV3),
    B('es2eu','Mañana lloverá',['Bihar euria egingo du'],['egiten','gaur','dago']),

    M([['Egingo du','Hará'],['Egiten du','Hace'],['Daukat','Tengo'],['Gogokoena','Favorito'],['Ze hotz!','¡Qué frío!']]),
    convo(3,CONV3),
    convo(4,CONV3),
    L('Nire urtaro gogokoena negua da',['uda','zen'],'Mi estación favorita es el invierno'),
    T('Mañana lloverá',['bihar euria egingo du']),
  ]},
]},
{ id:'u7', n:7, title:'Animales', sub:'Mascotas, el caserío y hablar de tus animales', color:'#b8436f', dark:'#8a3052',
  tips:`<h3>Mascotas</h3>
  <table><tbody>
  <tr><td>txakurra</td><td>el perro</td></tr><tr><td>katua</td><td>el gato</td></tr><tr><td>txoria</td><td>el pájaro</td></tr><tr><td>arraina</td><td>el pez</td></tr><tr><td>untxia</td><td>el conejo</td></tr><tr><td>sagua</td><td>el ratón</td></tr>
  </tbody></table>
  <h3>En el caserío (baserria)</h3>
  <table><tbody>
  <tr><td>behia</td><td>la vaca</td></tr><tr><td>ardia</td><td>la oveja</td></tr><tr><td>zaldia</td><td>el caballo</td></tr><tr><td>txerria</td><td>el cerdo</td></tr><tr><td>oiloa</td><td>la gallina</td></tr>
  </tbody></table>
  <p>El <b>baserri</b> es la casa de campo tradicional vasca. Y la <b>latxa</b>, como nuestra mascota, es una raza de oveja vasca.</p>
  <h3>«El», «un» y «los»</h3>
  <table><tbody>
  <tr><td>txakurra</td><td>el perro (la -a es «el»)</td></tr><tr><td>txakur bat</td><td>un perro (se quita la -a)</td></tr><tr><td>txakurrak</td><td>los perros (-ak = plural)</td></tr><tr><td>hiru txakur</td><td>tres perros (sin plural tras el número)</td></tr>
  </tbody></table>
  <h3>Colores y tamaños van detrás</h3>
  <p><i>katu zuri bat</i> = un gato blanco (literalmente «gato blanco uno»). <i>Zaldia handia da</i> = el caballo es grande.</p>
  <table><tbody><tr><td>handia</td><td>grande</td></tr><tr><td>txikia</td><td>pequeño</td></tr><tr><td>zuria</td><td>blanco</td></tr><tr><td>beltza</td><td>negro</td></tr></tbody></table>
  <h3>Tener uno o varios</h3>
  <p><i>Txakur bat <b>daukat</b></i> = tengo un perro. <i>Bi katu <b>dauzkat</b></i> = tengo dos gatos. <i>Baserrian behiak <b>daude</b></i> = en el caserío hay vacas.</p>
  <h3>«De» y «tiene»</h3>
  <p><b>-ren</b> = de: <i>txakurraren izena</i> = el nombre del perro. Cuando el animal «tiene» algo, lleva <b>-k</b>: <i>Txakurra<b>k</b> bost urte ditu</i> = el perro tiene cinco años.</p>`,

  { id:'l23', title:'Mascotas', ex:[

    I('Katua','El gato'),
    P('El gato','Katua',['Txakurra']),

    B('es2eu','Tengo un gato',['Katu bat daukat'],['katua','daukazu','bi']),

  { id:'l26', title:'Mi perro se llama…', ex:[

{ id:'u8', n:8, title:'La comida', sub:'Comer, beber, lo que te gusta y la sidrería', color:'#a35a2a', dark:'#7a421e',
  tips:`<h3>Lo básico</h3>
  <table><tbody>
  <tr><td>janaria</td><td>la comida</td></tr><tr><td>ogia</td><td>el pan</td></tr><tr><td>ura</td><td>el agua</td></tr><tr><td>esnea</td><td>la leche</td></tr><tr><td>gazta</td><td>el queso</td></tr><tr><td>arrautza</td><td>el huevo</td></tr><tr><td>arraina</td><td>el pescado (y el pez)</td></tr>
  </tbody></table>
  <h3>Fruta</h3>
  <table><tbody><tr><td>sagarra</td><td>la manzana</td></tr><tr><td>laranja</td><td>la naranja</td></tr><tr><td>platanoa</td><td>el plátano</td></tr><tr><td>sagardoa</td><td>la sidra (sagar + ardo, «vino de manzana»)</td></tr></tbody></table>
  <h3>Comer y beber</h3>
  <table><tbody>
  <tr><td>Ogia jaten dut</td><td>Como pan</td></tr><tr><td>Ura edaten dut</td><td>Bebo agua</td></tr><tr><td>Zer jaten duzu?</td><td>¿Qué comes?</td></tr>
  <tr><td>Gose naiz</td><td>Tengo hambre</td></tr><tr><td>Egarri naiz</td><td>Tengo sed</td></tr>
  </tbody></table>
  <h3>Me gusta / me gustan</h3>
  <p>Lo que gusta va delante: <i>Gazta gustatzen <b>zait</b></i> = me gusta el queso. Si son varias cosas: <i>Sagarrak gustatzen <b>zaizkit</b></i> = me gustan las manzanas (como <i>daukat → dauzkat</i>).</p>
  <p>Con <b>ez</b> cambia el orden: <i>Arraina <b>ez zait</b> gustatzen</i> = no me gusta el pescado. Y para preguntar: <i>Gazta gustatzen <b>zaizu</b>?</i> = ¿te gusta el queso?</p>
  <h3>En la sidrería (sagardotegia)</h3>
  <p>El menú típico es tortilla de bacalao, <i>txuleta</i> (chuletón) y de postre queso, membrillo e <i>intxaurrak</i> (nueces). Cuando alguien grita <b>«Txotx!»</b>, todos van a llenar el vaso directamente de la barrica.</p>
  <table><tbody><tr><td>On egin!</td><td>¡Buen provecho!</td></tr><tr><td>Oso goxoa da!</td><td>¡Está muy rico!</td></tr><tr><td>Kontua, mesedez</td><td>La cuenta, por favor</td></tr></tbody></table>`,

    I('Arrautza','El huevo'),
    P('El queso','Gazta',['Esnea','Arrautza']),
    M([['Ogia','El pan'],['Ura','El agua'],['Esnea','La leche'],['Gazta','El queso'],['Arrautza','El huevo']]),
    B('es2eu','Pan y queso, por favor',['Ogia eta gazta, mesedez'],['ura','bat','esnea']),
    I('Ur bat, mesedez','Un agua, por favor','Como en el bar: <b>bat</b> detrás y sin la -a: ura → ur bat.'),
    C('¿Cómo se dice «dos huevos»?','',['Bi arrautza','Bi arrautzak','Arrautza bat'],'Bi arrautza'),
    L('Ogia, gazta eta esnea',['ura','bat'],'Pan, queso y leche'),

    I('Sagardoa','La sidra','<b>sagar</b> (manzana) + <b>ardo</b> (vino): «vino de manzana».'),
    M([['Sagarra','La manzana'],['Laranja','La naranja'],['Platanoa','El plátano'],['Sagardoa','La sidra'],['Ardoa','El vino']]),
    D([{who:'Mikel',eu:'Kaixo! Zer nahi duzu?',es:'¡Hola! ¿Qué quieres?'}],['Bi sagar, mesedez. Zenbat da?','Bi sagarrak, mesedez.','Sagar bi naiz.'],'Bi sagar, mesedez. Zenbat da?','Dos manzanas, por favor. ¿Cuánto es?'),
    B('eu2es','Laranja bat eta bi platano',['Una naranja y dos plátanos'],['manzanas','tres','es']),
    L('Bost sagar dauzkat',['laranja','daukat'],'Tengo cinco manzanas'),

  ]},
  { id:'l30', title:'Comer y beber', ex:[

    I('Gustatzen zait','Me gusta','Lo que gusta va delante: <b>gazta gustatzen zait</b> = me gusta el queso.'),
    I('Gazta gustatzen zait','Me gusta el queso'),
    I('Ez zait gustatzen','No me gusta','Con <b>ez</b> cambia el orden: <b>ez zait</b> va antes que <b>gustatzen</b>.'),
    I('Arraina ez zait gustatzen','No me gusta el pescado','<b>arraina</b> es el pez y también el pescado.'),
    C('¿Qué significa «Esnea ez zait gustatzen»?','Esnea ez zait gustatzen',['No me gusta la leche','Me gusta la leche','No bebo leche'],'No me gusta la leche'),
    I('Sagarrak gustatzen zaizkit','Me gustan las manzanas','Si son varias cosas, <b>zait</b> pasa a <b>zaizkit</b> (como daukat → dauzkat).'),
    F('Me gustan los plátanos','Platanoak gustatzen','',['zaizkit','zait','dauzkat'],'zaizkit'),

    I('Nire janari gogokoena patata-tortilla da','Mi comida favorita es la tortilla de patatas','<b>gogokoena</b>, como con los animales y las estaciones.'),
    B('es2eu','Me gusta el pan',['Ogia gustatzen zait'],['zaizkit','ez','jaten']),

{ id:'u9', n:9, title:'El trabajo', sub:'Profesiones, dónde trabajas, horarios y compañeros', color:'#3d5a80', dark:'#2b4060',
  tips:`<h3>Las profesiones no tienen género</h3>
  <p><i>irakaslea</i> es profesor y profesora; <i>medikua</i>, médico y médica. Para decir tu profesión: profesión + <b>naiz</b> → <i>Irakaslea naiz</i>. Para otra persona: <b>da</b> → <i>Nire ama medikua da</i>.</p>
  <table><tbody>
  <tr><td>irakaslea</td><td>profesor/a</td></tr><tr><td>medikua</td><td>médico/a</td></tr><tr><td>erizaina</td><td>enfermero/a</td></tr><tr><td>sukaldaria</td><td>cocinero/a (sukalde = cocina)</td></tr>
  <tr><td>dendaria</td><td>dependiente/a (denda = tienda)</td></tr><tr><td>tabernaria</td><td>camarero/a de bar</td></tr><tr><td>nekazaria</td><td>agricultor/a</td></tr><tr><td>arrantzalea</td><td>pescador/a</td></tr><tr><td>ingeniaria</td><td>ingeniero/a</td></tr>
  </tbody></table>
  <h3>Dónde: -an / -n</h3>
  <p>Como con <i>baserrian</i>: <i>bulegoan</i> (en la oficina), <i>ospitalean</i>, <i>eskolan</i>, <i>jatetxean</i>, <i>dendan</i>. Y la frase: <i>Eskolan egiten dut lan</i> = trabajo en la escuela.</p>
  <h3>A qué hora: -etan</h3>
  <table><tbody>
  <tr><td>hiruretan</td><td>a las tres</td></tr><tr><td>bostetan</td><td>a las cinco</td></tr><tr><td>zortzietan</td><td>a las ocho</td></tr><tr><td>bederatzietan</td><td>a las nueve</td></tr><tr><td>hamarretan</td><td>a las diez</td></tr>
  </tbody></table>
  <p><i>Zortzietan hasten naiz</i> = empiezo a las ocho. <i>Bostetan bukatzen dut</i> = termino a las cinco.</p>
  <h3>Desde… hasta…</h3>
  <p><b>-tik</b> = desde, <b>-ra</b> = hasta: <i>astelehene<b>tik</b> ostirale<b>ra</b></i> = de lunes a viernes.</p>
  <h3>Cómo estás: nago</h3>
  <p><i>Nekatuta nago</i> = estoy cansado/a. <i>Pozik nago</i> = estoy contento/a. Y con <b>ez</b>, «lan» pasa a <b>lanik</b>: <i>Asteburuan ez dut lanik egiten</i> = el fin de semana no trabajo.</p>`,
  lessons:[

    I('Lana','El trabajo','Ya conoces <b>lan egiten dut</b> = trabajo.'),
    I('Zertan egiten duzu lan?','¿En qué trabajas?','<b>zertan</b> = en qué.'),
    I('Irakaslea','El profesor / la profesora','En euskera las profesiones no cambian según sea hombre o mujer.'),
    I('Irakaslea naiz','Soy profesor/a','Como <b>ikaslea naiz</b>: profesión + <b>naiz</b>.'),
    I('Medikua','El médico / la médica'),
    P('El médico','Medikua',['Irakaslea']),
    I('Erizaina','El enfermero / la enfermera'),
    I('Sukaldaria','El cocinero / la cocinera','<b>sukalde</b> = cocina.'),
    P('El cocinero','Sukaldaria',['Erizaina','Medikua']),
    M([['Lana','El trabajo'],['Irakaslea','Profesor/a'],['Medikua','Médico/a'],['Erizaina','Enfermero/a'],['Sukaldaria','Cocinero/a']]),
    B('es2eu','Soy enfermera',['Erizaina naiz','Ni erizaina naiz'],['zara','medikua','da']),

    L('Medikua naiz',['irakaslea','zara'],'Soy médico/a'),

{ id:'u10', n:10, title:'Los deportes', sub:'Pelota vasca, el frontón y el deporte rural', color:'#5f7a1e', dark:'#455a14',
  tips:`<h3>Hacer deporte</h3>
  <table><tbody>
  <tr><td>Zer kirol egiten duzu?</td><td>¿Qué deporte haces?</td></tr><tr><td>Futbolean jokatzen dut</td><td>Juego al fútbol</td></tr><tr><td>Pilotan jokatzen dut</td><td>Juego a pelota</td></tr>
  <tr><td>Igeri egiten dut</td><td>Nado</td></tr><tr><td>Korrika egiten dut</td><td>Corro</td></tr><tr><td>Mendira joaten naiz</td><td>Voy al monte</td></tr>
  </tbody></table>
  <p>El deporte al que juegas lleva <b>-an / -ean / -n</b>: <i>futbol<b>ean</b>, saskibaloi<b>an</b>, pilota<b>n</b></i>.</p>
  <h3>La pelota vasca (euskal pilota)</h3>
  <p>Se juega en el <b>pilotalekua</b> o <b>frontoia</b>, el frontón: un gran muro (el frontis) contra el que se lanza la pelota. El jugador es el <b>pilotari</b>. Se puede jugar <b>eskuz</b> (a mano), con <b>pala</b> o con <b>zesta-punta</b> (una cesta de mimbre).</p>
  <h3>El deporte rural (herri kirolak)</h3>
  <p>Nació del trabajo en el caserío y en el mar:</p>
  <table><tbody>
  <tr><td>harri-jasotzailea</td><td>levantador de piedras (harri = piedra, jaso = levantar)</td></tr>
  <tr><td>aizkolaria</td><td>cortador de troncos con hacha (aizkora = hacha)</td></tr>
  <tr><td>sokatira</td><td>tirar de la cuerda, por equipos (soka = cuerda)</td></tr>
  <tr><td>estropadak</td><td>regatas de traineras en el mar</td></tr>
  </tbody></table>
  <h3>Ganar y la txapela</h3>
  <p>Al ganador de un campeonato (<b>txapelketa</b>) se le pone una txapela, por eso el campeón es el <b>txapelduna</b>, «el que tiene la txapela».</p>
  <p>Quien hace algo lleva <b>-k</b>: <i>Ni<b>k</b> irabazi dut!</i> (¡he ganado yo!), <i>Nire aita<b>k</b> irabazi du</i> (ha ganado mi padre). Para preguntar: <i><b>Nork</b> irabazi du?</i> (¿quién ha ganado?).</p>`,

{ id:'u11', n:11, title:'De pintxos', sub:'La cuadrilla, pintxos, kalimotxo y el concurso de tortilla', color:'#7a2340', dark:'#57172d',
  tips:`<h3>Salir con la cuadrilla</h3>
  <p>En Euskadi se sale con la <b>koadrila</b>, el grupo de amigos de siempre, y se va de bar en bar: el <b>txikiteoa</b>.</p>
  <table><tbody>
  <tr><td>Ostiralean lagunekin ateratzen naiz</td><td>El viernes salgo con los amigos</td></tr><tr><td>Gaur kalera goaz!</td><td>¡Hoy salimos! («vamos a la calle»)</td></tr>
  <tr><td>Zer hartuko duzu?</td><td>¿Qué vas a tomar?</td></tr><tr><td>Zenbat da dena?</td><td>¿Cuánto es todo?</td></tr><tr><td>Gaur nik gonbidatzen dut</td><td>Hoy invito yo</td></tr><tr><td>Topa!</td><td>¡Salud! (al brindar)</td></tr>
  </tbody></table>
  <p><b>-ekin / -rekin</b> = con: <i>lagun<b>ekin</b></i> (con los amigos), <i>tipula<b>rekin</b></i> (con cebolla). Y <b>-rik gabe</b> = sin: <i>tipula<b>rik gabe</b></i>.</p>
  <h3>En la barra</h3>
  <table><tbody>
  <tr><td>pintxoa</td><td>el pintxo</td></tr><tr><td>gilda</td><td>guindilla, anchoa y aceituna en un palillo</td></tr><tr><td>patata-tortilla</td><td>tortilla de patatas</td></tr><tr><td>bakailaoa</td><td>el bacalao</td></tr>
  <tr><td>zuritoa</td><td>vaso pequeño de cerveza</td></tr><tr><td>txakolina</td><td>vino blanco ligero vasco</td></tr><tr><td>kalimotxoa</td><td>vino tinto con cola</td></tr><tr><td>mostoa</td><td>mosto (sin alcohol)</td></tr>
  </tbody></table>
  <p>El vino tinto es <i>ardo <b>beltza</b></i>, «vino negro», y el blanco, <i>ardo <b>zuria</b></i>.</p>
  <h3>Platos típicos</h3>
  <p>El <b>marmitakoa</b> es un guiso de <i>hegaluzea</i> (bonito) con patatas, nacido en los barcos: <i>arrantzaleen janaria</i>, comida de pescadores. El <b>bakailaoa pil-pilean</b> se hace moviendo la cazuela hasta que el aceite forma una salsa… ¡que suena «pil-pil»!</p>`,

{ id:'u12', n:12, title:'¿Qué hora es?', sub:'Las horas, y cuarto, y media, y quedar a una hora', color:'#5b5f97', dark:'#43467a',
  tips:`<h3>Zer ordu da? (¿Qué hora es?)</h3>
  <p>La una va en singular: <i>Ordu <b>bata</b> <b>da</b></i>. Desde las dos, el número lleva <b>-ak</b> y el verbo es <b>dira</b> (son):</p>
  <table><tbody>
  <tr><td>Ordu bata da</td><td>Es la una</td></tr><tr><td>Ordu biak dira</td><td>Son las dos</td></tr><tr><td>Hirurak dira</td><td>Son las tres (hiru → hirurak)</td></tr><tr><td>Laurak dira</td><td>Son las cuatro (lau → laurak)</td></tr>
  <tr><td>Bostak · Seiak · Zazpiak · Zortziak · Bederatziak</td><td>5 · 6 · 7 · 8 · 9</td></tr><tr><td>Hamarrak · Hamaikak · Hamabiak</td><td>10 · 11 · 12</td></tr>
  </tbody></table>
  <h3>Cuartos, medias y minutos</h3>
  <table><tbody>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[¿?¡!.,;:«»"]/g,' ').replace(/\s+/g,' ').trim();
const tokens=s=>String(s).replace(/[¿?¡!.,]/g,'').split(/\s+/).filter(Boolean);
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
/* Devuelve la respuesta correcta con la letra corregida subrayada (para fallos de una letra) */
function markFix(t,g){let p=0;while(p<t.length&&p<g.length&&t[p]===g[p])p++;
  let s=0;while(s<t.length-p&&s<g.length-p&&t[t.length-1-s]===g[g.length-1-s])s++;
  let a=p,b=t.length-s;
  if(a>=b){a=Math.max(0,p-1);b=a+1;} /* sobraba una letra: subrayamos dónde estaba */
  if(t[a]===' '&&b-a===1){if(a>0){a--;b--;}else{a++;b++;}}
  return esc(t.slice(0,a))+'<u class="fix">'+esc(t.slice(a,b))+'</u>'+esc(t.slice(b));}

  seq.forEach(([f,st,du,type])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t0+st);g.gain.exponentialRampToValueAtTime(0.18,t0+st+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+st+du);

        else if(!warned){warned=true;toast('Tu navegador no consigue reproducir la voz. Prueba con Chrome o Edge.');}};
      speechSynthesis.speak(u);
      /* Chrome puede quedarse en pausa con textos en segundo plano */
      setTimeout(()=>{try{if(speechSynthesis.paused)speechSynthesis.resume();}catch(e){}},300);

  }catch(e){}}

,'manzana':'sagar(ra)','tambien':'ere bai'

function hintify(text,lang){const G=lang==='eu'?GL_EU:GL_ES;
  return String(text).split(/(\s+)/).map(tok=>{const m=tok.match(/^([¿¡«"]*)(.*?)([?!.,»"]*)$/);if(!m||!m[2])return esc(tok);
    const h=G[norm(m[2])];if(!h)return esc(tok);
    return esc(m[1])+`<span class="hw" tabindex="0" data-w="${esc(m[2])}" data-l="${lang}">${esc(m[2])}<span class="hwt" role="tooltip">${esc(h)}</span></span>`+esc(m[3]);}).join('');}
function wireHints(box){const ws=[...box.querySelectorAll('.hw')];
  ws.forEach(w=>{w.onclick=e=>{e.stopPropagation();const was=w.classList.contains('on');ws.forEach(x=>x.classList.remove('on'));if(!was){w.classList.add('on');if(w.dataset.l==='eu')speak(w.dataset.w);}};
    w.onmouseenter=()=>{ws.forEach(x=>{if(x!==w)x.classList.remove('on')});};});
  box.addEventListener('click',()=>ws.forEach(x=>x.classList.remove('on')));}
/* Esfera de reloj para los ejercicios de la hora */
function clockSVG(h,m){const ha=((h%12)+m/60)*30*Math.PI/180,ma=m*6*Math.PI/180;
  const ticks=[...Array(12)].map((_,k)=>{const a=k*30*Math.PI/180,r1=k%3===0?36:39;return `<path d="M${50+r1*Math.sin(a)} ${50-r1*Math.cos(a)}L${50+43*Math.sin(a)} ${50-43*Math.cos(a)}" stroke="var(--fg)" stroke-width="${k%3===0?3:1.6}" stroke-linecap="round"/>`;}).join('');
  const nums=[[12,0],[3,90],[6,180],[9,270]].map(([n,d])=>{const a=d*Math.PI/180;return `<text x="${50+28*Math.sin(a)}" y="${50-28*Math.cos(a)+4.5}" text-anchor="middle" font-size="11" font-weight="900" font-family="Nunito,system-ui,sans-serif" fill="var(--muted)" opacity=".85">${n}</text>`;}).join('');
  return `<svg class="clock" viewBox="0 0 100 100" role="img" aria-label="Reloj"><circle cx="50" cy="50" r="47" fill="var(--soft)" stroke="var(--u, var(--green))" stroke-width="4"/>${ticks}${nums}
   <path d="M50 50L${50+21*Math.sin(ha)} ${50-21*Math.cos(ha)}" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/>
   <path d="M50 50L${50+34*Math.sin(ma)} ${50-34*Math.cos(ma)}" stroke="var(--sel-fg)" stroke-width="3.4" stroke-linecap="round"/><circle cx="50" cy="50" r="3.6" fill="var(--fg)"/></svg>`;}
const HINT_NOTE='<p class="hint-note">Pasa el ratón o toca una palabra subrayada para ver qué significa.</p>';

/* ================== TIPOS DE EJERCICIO ================== */
const spkBtn=(text,cls='')=>`<button class="spk ${cls}" data-say="${esc(text)}" aria-label="Escuchar">${ICON.speaker}</button>`;
function wireSpk(box){box.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,b.dataset.slow==='1'));}
function label(t){return `<p class="ex-label">${t}</p>`;}
function selectable(box,sel,onPick){const items=[...box.querySelectorAll(sel)];items.forEach(it=>it.onclick=()=>{items.forEach(x=>x.classList.remove('sel'));it.classList.add('sel');sfxTap();onPick(it);});}

const RENDER={
 intro(ex,box){
  const phrase=ex.eu.includes(' ');
  box.innerHTML=`${label(phrase?'Frase nueva':'Palabra nueva')}
   <div class="intro-card">${EM[ex.eu]?`<div class="em">${EM[ex.eu]}</div>`:''}
    <div class="eu">${esc(ex.eu)} ${spkBtn(ex.eu)}</div><div class="es">${esc(ex.es)}</div>
    ${ex.tip?`<div class="tip">${ex.tip}</div>`:''}</div>`;
  wireSpk(box);setTimeout(()=>speak(ex.eu),200);
 },
 pick(ex,box){
  let picked=null;
  box.innerHTML=`<h1 class="ex-title">¿Cuál significa «${esc(ex.es)}»?</h1><div class="cards">${shuffle(ex.opts).map(o=>`<button class="card" data-opt data-v="${esc(o)}"><span class="em">${EM[o]||'💬'}</span>${esc(o)}</button>`).join('')}</div>`;
  selectable(box,'.card',it=>{picked=it.dataset.v;speak(picked);setCheck(true);});
  ctrl={check:()=>({ok:picked===ex.eu,solution:ex.eu,meaning:picked===ex.eu?null:ex.es})};
 },
 choice(ex,box){
  let picked=null;
  box.innerHTML=`<h1 class="ex-title">${esc(ex.prompt)}</h1>${ex.speak?`<div>${spkBtn(ex.speak)}</div>`:''}
   <div class="opt-list">${shuffle(ex.opts).map((o,i)=>`<button class="opt" data-opt data-v="${esc(o)}"><span class="k">${i+1}</span>${esc(o)}</button>`).join('')}</div>`;
  wireSpk(box);if(ex.speak)setTimeout(()=>speak(ex.speak),200);
  selectable(box,'.opt',it=>{picked=it.dataset.v;setCheck(true);});
  ctrl={check:()=>({ok:picked===ex.ans,solution:ex.ans,say:ex.speak?null:ex.ans})};
 },
 build(ex,box){
  const listen=ex.t==='listen';
  const target=listen?ex.eu:ex.answers[0];
  const bank=shuffle([...tokens(target),...(ex.extra||[])]).map((w,i)=>({w,i}));
  let ans=[];
  let head;
  if(listen) head=`${label('Ejercicio de escucha')}<h1 class="ex-title">Toca lo que oyes</h1><div style="display:flex;gap:14px;justify-content:center">${spkBtn(ex.eu,'big')}<button class="spk slow" data-say="${esc(ex.eu)}" data-slow="1" aria-label="Escuchar despacio">LENTO</button></div>`;
  else if(ex.dir==='es2eu') head=`<h1 class="ex-title">Traduce al euskera</h1><div class="source">${mascot()}<div class="bubble"><span>${hintify(ex.src,'es')}</span></div></div>${HINT_NOTE}`;
  else head=`<h1 class="ex-title">Traduce al español</h1><div class="source">${mascot()}<div class="bubble">${spkBtn(ex.src)}<span>${hintify(ex.src,'eu')}</span></div></div>${HINT_NOTE}`;
  box.innerHTML=`${head}<div class="answer" id="ansZone" aria-label="Tu respuesta"></div><div class="bank" id="bankZone"></div>`;
  wireSpk(box);wireHints(box);
  if(listen||ex.dir==='eu2es')setTimeout(()=>speak(listen?ex.eu:ex.src),250);
  const draw=()=>{
    $('#ansZone').innerHTML=ans.map(i=>`<button class="tile" data-a="${i}">${esc(bank[i].w)}</button>`).join('');
    $('#bankZone').innerHTML=bank.map(b=>`<button class="tile${ans.includes(b.i)?' used':''}" data-b="${b.i}" ${ans.includes(b.i)?'tabindex="-1" aria-hidden="true"':''}>${esc(b.w)}</button>`).join('');
    box.querySelectorAll('[data-b]').forEach(t=>t.onclick=()=>{const i=+t.dataset.b;ans.push(i);sfxTap();if(ex.dir==='es2eu'||listen)speak(bank[i].w);draw();});
    box.querySelectorAll('[data-a]').forEach(t=>t.onclick=()=>{ans=ans.filter(x=>x!==+t.dataset.a);sfxTap();draw();});
    setCheck(ans.length>0);
  };
  draw();
  const accepted=(listen?[ex.eu]:ex.answers).map(norm);
  ctrl={check:()=>{const got=norm(ans.map(i=>bank[i].w).join(' '));const ok=accepted.includes(got);
    return {ok,solution:target,meaning:listen?ex.es:(ex.dir==='es2eu'?null:null),say:(ok&&ex.dir==='es2eu')?target:null};}};
 },
 listen(ex,box){RENDER.build(ex,box);},
 match(ex,box){
  const left=shuffle(ex.pairs.map((p,k)=>({k,t:p[0]}))),right=shuffle(ex.pairs.map((p,k)=>({k,t:p[1]})));
  box.innerHTML=`<h1 class="ex-title">Une las parejas</h1><div class="match"><div class="col">${left.map(x=>`<button class="mt" data-side="l" data-k="${x.k}">${esc(x.t)}</button>`).join('')}</div>
   <div class="col">${right.map(x=>`<button class="mt" data-side="r" data-k="${x.k}">${esc(x.t)}</button>`).join('')}</div></div>`;
  let selL=null,selR=null,matched=0,errs=0;
  const test=()=>{if(!selL||!selR)return;const a=selL,b=selR;selL=selR=null;
    if(a.dataset.k===b.dataset.k){[a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('right');});sfxTap();
      setTimeout(()=>{[a,b].forEach(x=>{x.classList.remove('right');x.classList.add('done');});},350);
      if(++matched===ex.pairs.length)setTimeout(()=>showFeedback({ok:true,note:errs?`Te equivocaste ${errs} ${errs===1?'vez':'veces'} por el camino, pero lo has conseguido.`:null},ex),500);}
    else{errs++;[a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('wrong');});sfxBad();setTimeout(()=>[a,b].forEach(x=>x.classList.remove('wrong')),450);}};
  box.querySelectorAll('.mt').forEach(btn=>btn.onclick=()=>{
    if(btn.dataset.side==='l'){box.querySelectorAll('[data-side=l]').forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');selL=btn;speak(btn.textContent);}
    else{box.querySelectorAll('[data-side=r]').forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');selR=btn;}
    test();});
  ctrl={check:()=>({ok:true})};
 },
 fill(ex,box){
  let picked=null;
  box.innerHTML=`<h1 class="ex-title">Completa la frase</h1>
   <div class="fill-line"><span>${esc(ex.before)}</span><span class="blank" id="blank">&nbsp;</span><span>${esc(ex.after)}</span></div>
   <p class="meaning-line">${esc(ex.es)}</p>
   <div class="bank">${shuffle(ex.opts).map(o=>`<button class="tile" data-opt data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  selectable(box,'.tile',it=>{picked=it.dataset.v;$('#blank').textContent=picked;setCheck(true);});
  const full=`${ex.before} ${ex.ans}${ex.after?' '+ex.after:''}`.trim();
  ctrl={check:()=>({ok:picked===ex.ans,solution:full,meaning:ex.es,say:full})};
 },
 type(ex,box){
  box.innerHTML=`<h1 class="ex-title">Escribe en euskera</h1><div class="source">${mascot()}<div class="bubble"><span>${hintify(ex.es,'es')}</span></div></div>${HINT_NOTE}
   <textarea class="type-in" id="typeIn" placeholder="Escribe aquí en euskera" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Tu respuesta en euskera"></textarea>`;
  wireHints(box);
  const ta=$('#typeIn');ta.oninput=()=>setCheck(ta.value.trim().length>0);
  ta.addEventListener('focus',()=>setTimeout(()=>{fitViewport();ta.scrollIntoView({block:'center',behavior:'smooth'});},350));setTimeout(()=>ta.focus({preventScroll:true}),100);
  ctrl={check:()=>{const got=norm(ta.value);const acc=ex.answers.map(norm);const disp=ex.answers[0].charAt(0).toUpperCase()+ex.answers[0].slice(1);
    if(acc.includes(got))return {ok:true,say:ex.answers[0]};
    const near=acc.find(a=>a.length>3&&lev(a,got)<=1);
    if(near)return {ok:true,note:`<span class="tiny">Tienes un pequeño fallo</span><span class="fixed">${markFix(near,got)}</span>`,say:near};
    return {ok:false,solution:disp,meaning:ex.es};}};
 },
 clock(ex,box){
  let picked=null;
  box.innerHTML=`<h1 class="ex-title">¿Qué hora es?</h1><div class="clock-wrap">${clockSVG(ex.h,ex.m)}</div>
   <div class="opt-list">${shuffle(ex.opts).map((o,i)=>`<button class="opt" data-opt data-v="${esc(o)}"><span class="k">${i+1}</span>${esc(o)}</button>`).join('')}</div>`;
  selectable(box,'.opt',it=>{picked=it.dataset.v;speak(picked);setCheck(true);});
  ctrl={check:()=>({ok:picked===ex.ans,solution:ex.ans,meaning:ex.es,say:ex.ans})};
 },
 dialog(ex,box){
  let picked=null;
  const hist=ex.hist.slice(-5);
  box.innerHTML=`${label('Conversación')}<h1 class="ex-title">¿Qué responde Ane?</h1>
   <div class="chat">${hist.map((m,i)=>`<div class="msg ${m.who.toLowerCase()}${i===hist.length-1?' q':''}"><div class="ava">${m.who[0]}</div><div class="mb"><div class="t">${esc(m.eu)}</div><div class="s">${esc(m.es)}</div></div></div>`).join('')}</div>
   <div class="opt-list">${shuffle(ex.opts).map((o,i)=>`<button class="opt" data-opt data-v="${esc(o)}"><span class="k">${i+1}</span>${esc(o)}</button>`).join('')}</div>`;
  setTimeout(()=>speak(hist[hist.length-1].eu),200);
  selectable(box,'.opt',it=>{picked=it.dataset.v;setCheck(true);});
  ctrl={check:()=>({ok:picked===ex.ans,solution:ex.ans,meaning:ex.aes,say:ex.ans})};
 },
};

renderHome();
